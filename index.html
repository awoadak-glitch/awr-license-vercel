<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AWR License</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color-scheme:dark}body{margin:0;background:#0d1117;color:#e6edf3}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px;margin-bottom:18px}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:block;font-size:13px;color:#9da7b3;margin-bottom:5px}input,button{box-sizing:border-box;width:100%;border-radius:9px;border:1px solid #3a414b;background:#0d1117;color:#e6edf3;padding:10px}button{cursor:pointer;background:#238636;border-color:#2ea043;font-weight:700}.secondary{background:#21262d;border-color:#444c56}.danger{background:#8b1a1a;border-color:#b62324}.warn{background:#9e6a03;border-color:#bb8009}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{width:auto}.result{white-space:pre-wrap;word-break:break-word;background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;min-height:24px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px;border-bottom:1px solid #30363d;text-align:right;vertical-align:top}.muted{color:#8b949e}.ok{color:#3fb950}.bad{color:#f85149}.keybox{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:18px;direction:ltr;text-align:left}@media(max-width:700px){table{display:block;overflow:auto}.wrap{padding:12px}}
</style>
</head>
<body><div class="wrap">
<div class="card"><h1>AWR License</h1><p class="muted">لوحة إدارة مفاتيح الترخيص.</p><div class="grid"><div><label>ADMIN_TOKEN</label><input id="token" type="password" autocomplete="off" placeholder="ألصق رمز الإدارة"></div><div style="align-self:end"><button class="secondary" onclick="refreshList()">تحديث القائمة</button></div></div></div>
<div class="card"><h2>إنشاء مفتاح</h2><div class="grid"><div><label>المدة بالأيام (0 = بدون انتهاء)</label><input id="days" type="number" min="0" max="3650" value="30"></div><div><label>عدد الأجهزة</label><input id="maxDevices" type="number" min="1" max="50" value="1"></div><div><label>ملاحظة</label><input id="note" maxlength="300" placeholder="مثلاً: عميل 001"></div></div><p><button onclick="createKey()">إنشاء المفتاح</button></p><div id="created" class="result muted">سيظهر المفتاح هنا. احفظه عند الإنشاء لأن السيرفر لا يخزنه بصورته الأصلية.</div></div>
<div class="card"><h2>المفاتيح</h2><div id="status" class="muted">لم يتم تحميل البيانات بعد.</div><div style="overflow:auto;margin-top:10px"><table><thead><tr><th>المفتاح</th><th>الحالة</th><th>الانتهاء</th><th>الأجهزة</th><th>ملاحظة</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
const tok=()=>document.getElementById('token').value.trim();
async function api(action,body={}){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok()},body:JSON.stringify({action,...body})});return r.json().catch(()=>({success:false,code:'BAD_RESPONSE'}));}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function createKey(){const out=document.getElementById('created');out.textContent='جارٍ الإنشاء...';const d=await api('create',{days:Number(days.value),max_devices:Number(maxDevices.value),note:note.value});if(!d.success){out.className='result bad';out.textContent='فشل: '+d.code;return}out.className='result ok keybox';out.textContent=d.key;await refreshList();}
async function refreshList(){status.textContent='جارٍ التحميل...';const d=await api('list');if(!d.success){status.className='bad';status.textContent='فشل: '+d.code;return}status.className='muted';status.textContent='عدد المفاتيح: '+d.licenses.length;rows.innerHTML='';for(const l of d.licenses){const tr=document.createElement('tr');const exp=l.expires_at&&Date.parse(l.expires_at)<=Date.now();const state=l.revoked?'موقوف':(exp?'منتهي':'فعال');tr.innerHTML=`<td style="direction:ltr">${esc(l.key_preview)}</td><td class="${l.revoked||exp?'bad':'ok'}">${state}</td><td>${l.expires_at?esc(new Date(l.expires_at).toLocaleString()):'بدون انتهاء'}</td><td>${esc(l.devices)} / ${esc(l.max_devices)}</td><td>${esc(l.note||'')}</td><td><div class="toolbar"><button class="${l.revoked?'':'warn'}" onclick="setRevoked('${l.id}',${!l.revoked})">${l.revoked?'تفعيل':'إيقاف'}</button><button class="secondary" onclick="resetDevices('${l.id}')">تصفير الأجهزة</button><button class="danger" onclick="deleteKey('${l.id}')">حذف</button></div></td>`;rows.appendChild(tr)}}
async function setRevoked(id,revoked){const d=await api('update',{id,revoked});if(!d.success)alert('فشل: '+d.code);await refreshList()}
async function resetDevices(id){if(!confirm('تصفير الأجهزة المرتبطة بهذا المفتاح؟'))return;const d=await api('reset_devices',{id});if(!d.success)alert('فشل: '+d.code);await refreshList()}
async function deleteKey(id){if(!confirm('حذف المفتاح نهائياً؟'))return;const d=await api('delete',{id});if(!d.success)alert('فشل: '+d.code);await refreshList()}
</script></body></html>
