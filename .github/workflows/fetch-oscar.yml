name: Fetch Oscar APK
on:
  push:
    paths:
      - '.github/workflows/fetch-oscar.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download current Oscar TV APK
        run: |
          curl -L --fail --retry 3 -o OscarTV.apk "https://github.com/Oscar-TV/apk/releases/download/v1.1.5/OscarTV.apk"
          sha256sum OscarTV.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OscarTV-v1.1.5
          path: OscarTV.apk
          retention-days: 1
