name: Export Apktool

on:
  push:
    branches: [tools-export]
    paths:
      - '.github/workflows/export-android-tools.yml'
      - 'tools/export-trigger.txt'

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tools-export
      - name: Download apktool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p toolbin
          curl -L --fail --retry 3 -o toolbin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          sha256sum toolbin/apktool.jar > toolbin/apktool.sha256
      - name: Commit tool to branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add toolbin/apktool.jar toolbin/apktool.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'Export apktool binary'
          git push origin HEAD:tools-export
