name: Build AWR VPN

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - awr-vpn-app
    paths:
      - 'android/AWRVPN/**'
      - '.github/workflows/build-awr-vpn.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android/AWRVPN
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AWR-VPN-debug
          path: android/AWRVPN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
