name: Probe Oscar API Domains
on:
  push:
    paths:
      - '.github/workflows/probe-oscar-domains.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Oscar API domains
        shell: bash
        run: |
          set +e
          domains=(
            "https://ostvapp.cam/"
            "https://api.myychann.site/"
            "https://api.ossccaarr111.online/"
            "https://ostv-11-11.xyz/"
            "https://ostv-11-22.xyz/"
            "https://ostv-11-33.xyz/"
            "https://ostv-11-44.xyz/"
            "https://ostv-11-55.xyz/"
            "https://ostv-11-66.xyz/"
            "https://ostv-11-77.xyz/"
            "https://api123456789.12316589413216556oscchannz.space/"
            "https://weathered-forest-d8db.manon-lol2000.workers.dev/"
          )
          : > domain-results.txt
          for d in "${domains[@]}"; do
            echo "=== $d" | tee -a domain-results.txt
            curl -L -sS -o /tmp/body -D /tmp/headers --connect-timeout 8 --max-time 15 -w "code=%{http_code} final=%{url_effective} ip=%{remote_ip} time=%{time_total}\n" "${d}api/ping.php" 2>&1 | tee -a domain-results.txt
            head -c 300 /tmp/body 2>/dev/null | tr '\n' ' ' | tee -a domain-results.txt
            echo | tee -a domain-results.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: domain-results
          path: domain-results.txt
          retention-days: 1
